# Local stack. Postgres, pgAdmin, the API, and the site. No env files.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: releasecheck
      POSTGRES_PASSWORD: releasecheck
      POSTGRES_DB: releasecheck
    ports:
      - "5432:5432"
    networks:
      - releasecheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasecheck -d releasecheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: releasecheck
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    entrypoint: ["/bin/sh", "/pgadmin-config/entrypoint.sh"]
    ports:
      - "5050:80"
    networks:
      - releasecheck
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin-config/pgpass:ro
      - ./docker/pgadmin/entrypoint.sh:/pgadmin-config/entrypoint.sh:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://releasecheck:releasecheck@postgres:5432/releasecheck
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      GRAPHIQL_ENABLED: "true"
    networks:
      - releasecheck
    volumes:
      - server_tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{ __typename }'})}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - releasecheck
    volumes:
      - web_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 15

  announce:
    image: alpine:3.20
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      pgadmin:
        condition: service_started
    restart: "no"
    command:
      - sh
      - -c
      - |
        printf '\033[1;36m%s\033[0m\n' 'Frontend  http://localhost:3000'
        printf '\033[1;33m%s\033[0m\n' 'Backend   http://localhost:4000/graphql'
        printf '\033[1;35m%s\033[0m\n' 'pgAdmin   http://localhost:5050'

networks:
  releasecheck:
    name: releasecheck
    driver: bridge

volumes:
  postgres_data:
    name: releasecheck-postgres
  pgadmin_data:
    name: releasecheck-pgadmin
  server_tmp:
    name: releasecheck-server-tmp
  web_cache:
    name: releasecheck-web-cache

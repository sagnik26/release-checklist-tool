services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - server/.env
    environment:
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
    networks:
      - releasecheck
    volumes:
      - ./server/.env:/app/server/.env:ro
      - server_tmp:/tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{ __typename }'})}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - releasecheck
    volumes:
      - web_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 15

  announce:
    image: alpine:3.20
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        printf '\033[1;36m%s\033[0m\n' 'Frontend  http://localhost:3000'
        printf '\033[1;33m%s\033[0m\n' 'Backend   http://localhost:4000/graphql'

networks:
  releasecheck:
    name: releasecheck
    driver: bridge

volumes:
  server_tmp:
    name: releasecheck-server-tmp
  web_cache:
    name: releasecheck-web-cache
